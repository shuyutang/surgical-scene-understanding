[project]
name = "surgscene"
version = "0.1.0"
description = "Instrument-aware surgical scene understanding with structured inference (practice project)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.*",
    "torchvision==0.23.*",
    "segmentation-models-pytorch>=0.5",
    "timm>=1.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "opencv-python-headless>=4.10",
    "pillow>=10",
    "pyyaml>=6",
    "tqdm>=4.66",
    "matplotlib>=3.9",
]

[dependency-groups]
deploy = [
    "nvidia-cuda-nvcc-cu12==12.8.*",
    "onnx>=1.23.0",
    "onnxscript>=0.7.2",
    "tensorrt-cu12>=10.9,<11",
]
dev = ["pytest>=8"]
sam = [
    "accelerate>=1.15.0",
    "transformers>=4.56",
]
stereo = [
    "opt-einsum>=3.4.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surgscene"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E731: one-line local lambdas are used as formatters in report code.
# E741: single-letter names follow the math/notation (O = observations, I = identity, l = length).
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# report code builds markdown tables from long f-string templates
"scripts/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["surgscene"]
